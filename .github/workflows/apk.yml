name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar la app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk ClimaPlantas.apk

      - name: Guardar como descarga del proceso
        uses: actions/upload-artifact@v4
        with:
          name: ClimaPlantas-apk
          path: ClimaPlantas.apk

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Clima Plantas (última versión)
          body: "Descarga ClimaPlantas.apk en el celular Android e instálala."
          files: ClimaPlantas.apk
          make_latest: true
